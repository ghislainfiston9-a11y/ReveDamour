<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Rêve d'Amour - Rencontres Mondiales & IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F0E17;
            --card-bg: #1A1926;
            --primary: #FF3366;
            --text-main: #FFFFFF;
            --text-muted: #A7A9BE;
            --accent-ai: #9D4EDD;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 51, 102, 0.2);
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            text-align: center;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 15px;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 500;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #232232;
            border: 1px solid #35334A;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }
        textarea { resize: none; height: 70px; }
        .ai-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.1), rgba(255, 51, 102, 0.1));
            border: 1px solid var(--accent-ai);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #FF5C8A);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        #resultatBox {
            margin-top: 15px;
            padding: 12px;
            background: #14131D;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            font-size: 14px;
            line-height: 1.5;
            min-height: 50px;
            color: #E2E2E9;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Le Rêve d'Amour ❤️</h1>
        <p class="subtitle">Trouvez l'âme sœur à travers le monde grâce à Cupidon IA</p>

        <div class="form-group">
            <div class="section-title">👤 Votre Profil</div>
            <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                <input type="text" id="myName" value="Ghislain">
                <input type="text" id="myCountry" value="Bénin 🇧🇯">
            </div>
            <textarea id="myBio">Passionné d'écriture et de projets créatifs, j'aime explorer de nouvelles cultures.</textarea>
        </div>

        <div class="form-group">
            <div class="section-title">✨ Profil de votre Match</div>
            <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                <input type="text" id="matchName" value="Elena">
                <input type="text" id="matchCountry" value="Italie 🇮🇹">
            </div>
            <textarea id="matchBio">Amoureuse d'art, de café serré et de voyages à travers l'Europe.</textarea>
        </div>

        <div class="ai-card">
            <div class="section-title" style="color: var(--accent-ai);">🪄 Cupidon IA - Briseur de glace</div>
            <button onclick="genererIceBreaker()">Générer le message parfait ✨</button>
            <div id="resultatBox">En attente de génération...</div>
        </div>
    </div>

    <script>
        async function genererIceBreaker() {
            const resultatBox = document.getElementById('resultatBox');
            resultatBox.innerText = "Cupidon IA réfléchit... 💫";

            const payload = {
                user_profil: {
                    nom: document.getElementById('myName').value,
                    age: 28,
                    pays: document.getElementById('myCountry').value,
                    biographie: document.getElementById('myBio').value,
                    passions: ["écriture"]
                },
                match_profil: {
                    nom: document.getElementById('matchName').value,
                    age: 26,
                    pays: document.getElementById('matchCountry').value,
                    biographie: document.getElementById('matchBio').value,
                    passions: ["art"]
                }
            };

            try {
                const response = await fetch('https://VOTRE-URL-RENDER/api/cupidon-ia/icebreaker', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (response.ok) {
                    resultatBox.innerText = data.message_suggere;
                } else {
                    resultatBox.innerText = "Erreur de l'IA.";
                }
            } catch (error) {
                resultatBox.innerText = "Erreur de connexion au serveur.";
            }
        }
    </script>
</body>
              </html>
